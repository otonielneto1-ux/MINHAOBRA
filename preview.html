<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Minha Obra — preview</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Estilo: PRANCHETA — claro e técnico, cara de papel de projeto: linha fina, nada de sombra. */
:root{
  /* paleta do Otoniel */
  --primary:#1F4E79;
  --navy:#132B40;
  --bg:#F4F7FA;
  --amber:#F5A623;
  --red:#D64545;
  /* derivadas (texto com contraste para o sol) */
  --green:#23874E;
  --ok-ink:#17663A;
  --warn-ink:#7F5200;
  --crit-ink:#B23030;
  --paper:#FFFFFF;
  --ink:#132B40;
  --muted:#4A5D70;
  --line:#C9D4DF;
  --line-strong:#132B40;
  --primary-tint:#E6EEF6;
  --sans:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,"Cascadia Mono",Consolas,"SFMono-Regular",Menlo,monospace;
  --side:252px;
  --bar:70px;
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{font-family:var(--sans);background:var(--bg);color:var(--ink);font-size:17px;line-height:1.45}
.num{font-variant-numeric:tabular-nums}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--amber);outline-offset:2px}
/* rótulo técnico: o "carimbo" da prancheta */
.lab{font-family:var(--mono);font-size:13px;font-weight:500;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}

/* ---------- casca ---------- */
.side{position:fixed;inset:0 auto 0 0;width:var(--side);background:var(--paper);border-right:1px solid var(--line);display:flex;flex-direction:column;z-index:20}
.brand{padding:22px 22px 18px;border-bottom:1px solid var(--line)}
.brand-name{font-weight:700;font-size:20px;letter-spacing:-.01em}
.side nav{display:flex;flex-direction:column;padding:12px 0}
.nav-btn{display:flex;align-items:center;gap:14px;min-height:52px;padding:0 22px;font-family:var(--mono);font-size:14px;font-weight:500;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);text-align:left;border-left:3px solid transparent}
.nav-btn svg{width:22px;height:22px;flex:none}
.nav-btn:hover{color:var(--ink);background:var(--bg)}
.nav-btn[aria-current="page"]{color:var(--primary);border-left-color:var(--primary);background:var(--primary-tint);font-weight:600}
.side-foot{margin-top:auto;border-top:1px solid var(--line);padding:16px 22px}
.side-foot b{display:block;font-size:16px}

.main{margin-left:var(--side);min-height:100vh}
.top{position:sticky;top:0;z-index:10;background:var(--paper);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:16px;padding:12px 32px}
.obra .lab{font-size:12px}
.obra-name{font-size:21px;font-weight:600;line-height:1.2}
.obra-meta{font-family:var(--mono);font-size:12px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted)}
.top-right{margin-left:auto;display:flex;align-items:center;gap:14px}
.status-line{font-family:var(--mono);font-size:13px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);text-align:right}
.status-line i{display:inline-block;width:8px;height:8px;background:var(--green);margin-right:6px;vertical-align:1px}
.content{padding:28px 32px 56px;max-width:1320px}
.page-head{display:flex;flex-wrap:wrap;align-items:flex-end;gap:12px 20px;margin-bottom:22px}
.page-head h1{font-size:30px;font-weight:600;line-height:1.15;letter-spacing:-.015em;margin-top:4px}
.page-head .actions{margin-left:auto;display:flex;gap:10px;flex-wrap:wrap}
.bottombar{display:none}

/* ---------- peças ---------- */
.sheet{background:var(--paper);border:1px solid var(--line)}
.section{background:var(--paper);border:1px solid var(--line);padding:20px 22px}
.sec-head{display:flex;align-items:center;gap:12px;padding-bottom:10px;margin-bottom:6px;border-bottom:1px solid var(--line-strong)}
.sec-head .lab{color:var(--ink);font-weight:600}
.sec-head .link{margin-left:auto;font-family:var(--mono);font-size:13px;font-weight:600;text-transform:uppercase;letter-spacing:.08em;color:var(--primary);min-height:44px;padding:0 4px}
.grid{display:grid;grid-template-columns:repeat(12,1fr);gap:20px}
.span-7{grid-column:span 7}.span-5{grid-column:span 5}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:48px;padding:0 18px;border:1.5px solid var(--primary);color:var(--primary);background:var(--paper);font-family:var(--mono);font-size:14px;font-weight:600;text-transform:uppercase;letter-spacing:.07em;border-radius:3px;white-space:nowrap}
.btn svg{width:20px;height:20px;flex:none}
.btn:hover{background:var(--primary-tint)}
.btn-fill{background:var(--primary);color:#fff}
.btn-fill:hover{background:#183F63}
.btn-quiet{border-color:var(--line);color:var(--ink)}
.btn-lg{min-height:56px;font-size:15px;padding:0 24px}

/* status: quadradinho + carimbo */
.st{display:inline-flex;align-items:center;gap:8px;font-family:var(--mono);font-size:13px;font-weight:600;text-transform:uppercase;letter-spacing:.07em;white-space:nowrap}
.st::before{content:"";width:10px;height:10px;background:currentColor;flex:none}
.st-ok{color:var(--ok-ink)} .st-warn{color:var(--warn-ink)} .st-crit{color:var(--crit-ink)} .st-neutral{color:var(--muted)}
.st-warn::before{background:var(--amber)} .st-crit::before{background:var(--red)} .st-ok::before{background:var(--green)}
.st-neutral::before{background:transparent;border:1.5px solid var(--muted)}

/* caixa de seleção estilo prancheta */
.box{width:24px;height:24px;flex:none;border:1.5px solid var(--ink);display:grid;place-items:center;color:#fff}
.box svg{width:16px;height:16px}
.box.ok{background:var(--green);border-color:var(--green)}
.box.crit{background:var(--red);border-color:var(--red)}

/* faixa de números (KPI) */
.kpis{display:grid;grid-template-columns:repeat(4,1fr);background:var(--paper);border:1px solid var(--line);margin-bottom:20px}
.kpi{padding:18px 22px;border-left:1px solid var(--line)}
.kpi:first-child{border-left:0}
.kpi b{display:block;font-size:52px;font-weight:500;line-height:1;letter-spacing:-.02em}
.kpi b small{font-size:26px;font-weight:500}
.kpi .lab{display:block;margin-top:10px;line-height:1.3}
.kpi.crit b{color:var(--red)}
.kpi.warn b{color:var(--warn-ink)}

/* avanço */
.av-top{display:flex;flex-wrap:wrap;align-items:flex-end;gap:10px 28px;padding:14px 0 6px}
.av-num{font-size:64px;font-weight:500;line-height:.95;letter-spacing:-.03em}
.av-num small{font-size:30px}
.av-prev{font-size:30px;font-weight:500;color:var(--muted);line-height:1}
.etapas{margin-top:14px}
.etapa-row{display:grid;grid-template-columns:86px 1fr auto;align-items:center;gap:16px;padding:12px 0;border-top:1px solid var(--line)}
.etapa-row:first-child{border-top:0}
.etapa-row b{font-size:17px;font-weight:600}
.bar{position:relative;height:10px;background:var(--bg);border:1px solid var(--line)}
.bar i{position:absolute;inset:-1px auto -1px -1px;background:var(--primary)}
.bar .mark{position:absolute;top:-6px;bottom:-6px;width:2px;background:var(--navy)}
.etapa-val{text-align:right;white-space:nowrap;font-family:var(--mono);font-size:14px;color:var(--muted)}
.etapa-val b{font-family:var(--sans);font-size:21px;color:var(--ink);font-weight:600}
.legend{display:flex;gap:18px;flex-wrap:wrap;margin-top:10px}
.legend span{display:inline-flex;align-items:center;gap:8px}
.legend i{display:inline-block;width:20px;height:3px}
.notice{display:flex;align-items:center;gap:12px;width:100%;margin-top:16px;padding:12px 14px;border:1px solid var(--amber);border-left:6px solid var(--amber);text-align:left;font-weight:600;font-size:16px;min-height:52px}
.notice .go{margin-left:auto;font-family:var(--mono);font-size:13px;text-transform:uppercase;letter-spacing:.07em;color:var(--primary)}

/* linhas de lista */
.row{display:flex;align-items:center;gap:14px;padding:14px 0;border-top:1px solid var(--line);min-height:68px;width:100%;text-align:left}
.sec-head + .row,.sec-head + .list .row:first-child{border-top:0}
.list .row:first-child{border-top:0}
.row-main{flex:1;min-width:0}
.row-title{font-weight:600;font-size:18px;line-height:1.3}
.row-meta{font-family:var(--mono);font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin-top:3px}
.row-meta.crit{color:var(--crit-ink);font-weight:600}
.row-meta.warn{color:var(--warn-ink);font-weight:600}
.row-qty{font-size:24px;font-weight:600;text-align:right;white-space:nowrap}
.row-qty small{font-family:var(--mono);font-size:14px;font-weight:500;color:var(--muted)}
.mark-sq{width:14px;height:14px;flex:none;margin-top:6px;align-self:flex-start}
.foot-box{display:flex;align-items:center;gap:16px;border:1px solid var(--line);padding:14px 16px;margin-top:14px}
.foot-box .v{font-size:30px;font-weight:600;line-height:1}
.foot-box .btn{margin-left:auto}

/* efetivo resumo */
.tri{display:grid;grid-template-columns:repeat(3,1fr);border:1px solid var(--line);margin-top:14px}
.tri div{padding:12px 14px;border-left:1px solid var(--line)}
.tri div:first-child{border-left:0}
.tri b{display:block;font-size:32px;font-weight:500;line-height:1.1}
.fun-list{margin-top:12px}
.fun{display:flex;justify-content:space-between;padding:9px 0;border-top:1px solid var(--line);font-size:16px}
.fun:first-child{border-top:0}
.fun b{font-weight:600}

/* PCP */
.weekbar{display:flex;flex-wrap:wrap;align-items:stretch;gap:12px;margin-bottom:18px}
.weekpick{display:flex;align-items:center;background:var(--paper);border:1px solid var(--line)}
.weekpick button{width:50px;height:52px;display:grid;place-items:center;color:var(--primary)}
.weekpick button svg{width:22px;height:22px}
.weekpick b{font-family:var(--mono);font-size:15px;font-weight:600;letter-spacing:.04em;padding:0 8px;white-space:nowrap;border-left:1px solid var(--line);border-right:1px solid var(--line);align-self:stretch;display:flex;align-items:center}
.ppc-box{display:flex;align-items:center;gap:12px;background:var(--paper);border:1px solid var(--line);padding:6px 16px}
.ppc-box b{font-size:32px;font-weight:500;line-height:1}
.daytabs{display:none}
.week{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));background:var(--paper);border:1px solid var(--line)}
.daycol{border-left:1px solid var(--line);min-width:0}
.daycol:first-child{border-left:0}
.daycol h3{display:flex;justify-content:space-between;align-items:center;padding:12px 14px;border-bottom:1px solid var(--line-strong);font-family:var(--mono);font-size:13px;font-weight:600;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);min-height:48px}
.daycol.is-today{background:#FBFCFE}
.daycol.is-today h3{color:var(--primary);border-bottom:3px solid var(--primary)}
.daycol.is-today h3::after{content:"HOJE";font-size:12px;border:1.5px solid var(--primary);padding:1px 6px}
.task{padding:14px;border-bottom:1px solid var(--line)}
.task-top{display:flex;gap:10px;align-items:flex-start}
.task-title{font-weight:600;font-size:16px;line-height:1.3}
.task-meta{font-family:var(--mono);font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin-top:4px}
.task-qty{display:flex;align-items:baseline;gap:6px;margin:12px 0 0 34px}
.task-qty b{font-size:28px;font-weight:500;line-height:1}
.task-qty span{font-family:var(--mono);font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
.task-foot{display:flex;flex-direction:column;gap:10px;margin:10px 0 0 34px}
.task .btn{width:100%;min-height:46px;font-size:13px;padding:0 10px}
.empty-day{padding:16px 14px;color:var(--muted)}
.chart{margin-top:20px}
.mot{display:grid;grid-template-columns:190px 1fr 40px;gap:14px;align-items:center;padding:10px 0;border-top:1px solid var(--line);font-size:16px}
.mot:first-of-type{border-top:0}
.mot .bar i{background:var(--red)}
.mot b{text-align:right;font-size:20px;font-weight:600}

/* efetivo do dia */
.toolbar{display:flex;flex-wrap:wrap;gap:12px;align-items:stretch;margin-bottom:18px}
.datebox{display:flex;align-items:center;gap:10px;background:var(--paper);border:1px solid var(--line);padding:0 16px;min-height:48px;font-family:var(--mono);font-size:15px;font-weight:600;letter-spacing:.04em;white-space:nowrap}
.datebox svg{width:20px;height:20px;color:var(--primary)}
.group{background:var(--paper);border:1px solid var(--line);padding:6px 20px 8px;margin-bottom:16px}
.group .sec-head{margin-top:10px}
.group .count{font-family:var(--mono);font-size:13px;font-weight:600;color:var(--ink)}
.person{display:grid;grid-template-columns:minmax(200px,1.1fr) auto minmax(220px,.9fr);gap:12px 18px;align-items:center;padding:12px 0;border-top:1px solid var(--line)}
.sec-head + .person{border-top:0}
.person-name{font-weight:600;font-size:18px}
.person-role{font-family:var(--mono);font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
.seg{display:grid;grid-template-columns:repeat(4,auto);border:1.5px solid var(--ink)}
.seg button{min-height:46px;padding:0 14px;font-family:var(--mono);font-size:13px;font-weight:600;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);border-left:1.5px solid var(--ink)}
.seg button:first-child{border-left:0}
.seg button[aria-pressed="true"].v-Presente{background:var(--green);color:#fff}
.seg button[aria-pressed="true"].v-Falta{background:var(--red);color:#fff}
.seg button[aria-pressed="true"].v-Atestado{background:var(--amber);color:var(--navy)}
.seg button[aria-pressed="true"].v-Afastado{background:var(--navy);color:#fff}
.pac select{width:100%;min-height:46px;border:1px solid var(--line);border-radius:0;padding:0 12px;font:inherit;font-size:16px;background:var(--paper);color:var(--ink)}
.pac select:disabled{color:var(--muted);background:var(--bg)}
.savebar{position:sticky;bottom:0;margin:20px -32px -56px;padding:14px 32px;background:var(--paper);border-top:1px solid var(--line-strong);display:flex;align-items:center;gap:14px}
.savebar .num{font-family:var(--mono);font-size:14px;font-weight:600;text-transform:uppercase;letter-spacing:.06em}
.savebar .btn{margin-left:auto}
.save-short{display:none}

/* vazio */
.empty{max-width:580px;margin:40px auto;text-align:center;background:var(--paper);border:1.5px dashed var(--line);padding:48px 28px}
.empty-icon{width:88px;height:88px;border:1.5px solid var(--primary);color:var(--primary);display:grid;place-items:center;margin:0 auto 20px}
.empty-icon svg{width:44px;height:44px}
.empty h2{font-size:26px;font-weight:600;margin:10px 0}
.empty p{font-size:17px;color:var(--muted);margin-bottom:26px}
.empty .btn{white-space:normal;max-width:100%;line-height:1.25;padding-top:10px;padding-bottom:10px}

/* janela */
.scrim{position:fixed;inset:0;background:rgba(19,43,64,.5);display:none;align-items:center;justify-content:center;z-index:50;padding:16px}
.scrim.open{display:flex}
.modal{background:var(--paper);border:1px solid var(--line-strong);width:100%;max-width:480px;padding:24px}
.modal h2{font-size:24px;font-weight:600;margin:6px 0 4px}
.modal .sub{color:var(--muted);font-size:16px;margin-bottom:18px}
.field{margin-bottom:18px}
.field > .lab{display:block;margin-bottom:8px;color:var(--ink);font-weight:600}
.qty-input{display:flex;align-items:center;border:1.5px solid var(--ink)}
.qty-input input{flex:1;min-width:0;border:0;font:inherit;font-size:36px;font-weight:500;padding:8px 14px;color:var(--ink);border-radius:0}
.qty-input span{padding:0 16px;font-family:var(--mono);font-weight:600;font-size:18px;color:var(--muted)}
.qty-hint{margin-top:10px}
.reasons{display:grid;grid-template-columns:1fr 1fr;border-top:1px solid var(--line);border-left:1px solid var(--line)}
.reasons button{min-height:50px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);font-size:15px;font-weight:500;padding:0 10px}
.reasons button[aria-pressed="true"]{background:var(--red);color:#fff;font-weight:600}
.modal-actions{display:flex;gap:10px;margin-top:6px}
.modal-actions .btn{flex:1}
.sheet-item{display:flex;align-items:center;gap:14px;min-height:58px;width:100%;padding:0 4px;font-family:var(--mono);font-size:15px;font-weight:600;text-transform:uppercase;letter-spacing:.07em;border-top:1px solid var(--line);text-align:left}
.sheet-item:first-of-type{border-top:0}
.sheet-item svg{width:22px;height:22px;color:var(--primary)}

.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%) translateY(30px);background:var(--navy);color:#fff;font-family:var(--mono);font-size:14px;font-weight:600;letter-spacing:.03em;padding:14px 18px;opacity:0;transition:.2s;z-index:60;pointer-events:none;max-width:calc(100% - 32px);text-align:center}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* ---------- responsivo ---------- */
@media (max-width:1180px){
  .week{grid-template-columns:repeat(3,minmax(0,1fr))}
  .daycol:nth-child(4){border-left:0}
  .daycol:nth-child(n+4){border-top:1px solid var(--line-strong)}
  .span-7,.span-5{grid-column:span 12}
}
@media (max-width:900px){
  .side{display:none}
  .main{margin-left:0;padding-bottom:calc(var(--bar) + env(safe-area-inset-bottom))}
  .top{padding:10px 16px}
  .obra-name{font-size:19px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .obra{min-width:0}
  .obra-meta{display:none}
  .status-line .full{display:none}
  .top .btn{min-height:44px;padding:0 12px}
  .content{padding:18px 16px 28px}
  .page-head h1{font-size:26px}
  .page-head .actions{margin-left:0;width:100%}
  .page-head .actions .btn{flex:1}
  .section{padding:16px}
  .kpis{grid-template-columns:repeat(2,1fr)}
  .kpi{padding:14px 16px}
  .kpi:nth-child(3){border-left:0}
  .kpi:nth-child(n+3){border-top:1px solid var(--line)}
  .kpi b{font-size:44px}
  .av-num{font-size:56px}
  .etapa-row{grid-template-columns:62px 1fr auto;gap:10px}
  .etapa-val b{font-size:19px}
  .bottombar{display:grid;grid-template-columns:repeat(5,1fr);position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--paper);border-top:1px solid var(--line-strong);padding-bottom:env(safe-area-inset-bottom);height:calc(var(--bar) + env(safe-area-inset-bottom))}
  .tab{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;color:var(--muted);font-family:var(--mono);font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.05em;min-height:var(--bar);border-top:3px solid transparent;margin-top:-1px}
  .tab svg{width:24px;height:24px}
  .tab[aria-current="page"]{color:var(--primary);border-top-color:var(--primary)}
  .daytabs{display:grid;grid-template-columns:repeat(6,1fr);border:1px solid var(--line);background:var(--paper);margin-bottom:12px}
  .daytabs button{min-height:58px;border-left:1px solid var(--line);font-family:var(--mono);font-weight:600;font-size:14px;text-transform:uppercase;line-height:1.15;display:flex;flex-direction:column;align-items:center;justify-content:center}
  .daytabs button:first-child{border-left:0}
  .daytabs button small{font-size:11px;font-weight:500;color:var(--muted)}
  .daytabs button[aria-pressed="true"]{background:var(--primary);color:#fff}
  .daytabs button[aria-pressed="true"] small{color:#D8E2EC}
  .week{grid-template-columns:1fr}
  .daycol{display:none;border-left:0}
  .daycol.show{display:block}
  .daycol:nth-child(n+4){border-top:0}
  .daycol h3{display:none}
  .mot{grid-template-columns:130px 1fr 32px}
  .group{padding:4px 14px 6px}
  .person{grid-template-columns:1fr}
  .seg{grid-template-columns:repeat(4,1fr)}
  .seg button{padding:0 2px;font-size:12px;letter-spacing:.02em}
  .savebar{margin:16px -16px -28px;padding:12px 16px;bottom:calc(var(--bar) + env(safe-area-inset-bottom))}
  .save-long{display:none}.save-short{display:inline}
  .empty{margin:24px 0;padding:36px 18px}
  .scrim{align-items:flex-end;padding:0}
  .modal{max-width:none;border-width:1px 0 0;padding:22px 16px calc(22px + env(safe-area-inset-bottom))}
  .toast{bottom:calc(var(--bar) + 18px)}
}
@media (max-width:380px){
  .kpi b{font-size:38px}
  .av-num{font-size:50px}
  .tri b{font-size:26px}
}
</style>
</head>
<body>

<aside class="side" aria-label="Menu principal">
  <div class="brand"><div class="lab">Gestão de canteiro</div><div class="brand-name">Minha Obra</div></div>
  <nav id="sidenav"></nav>
  <div class="side-foot"><b>Otoniel Neto</b><span class="lab">Engenheiro</span></div>
</aside>

<div class="main">
  <header class="top">
    <div class="obra">
      <div class="lab">Obra selecionada</div>
      <div class="obra-name">Conviver Costamare</div>
      <div class="obra-meta">Parnaíba/PI · 41,8% concluído</div>
    </div>
    <div class="top-right">
      <div class="status-line"><span class="full">Qua · 07/10/2026<br></span><i></i>Online</div>
      <button class="btn btn-quiet" data-toast="Trocar obra: só há uma obra cadastrada">Trocar ▾</button>
    </div>
  </header>
  <main class="content" id="view"></main>
</div>

<nav class="bottombar" id="bottomnav" aria-label="Menu principal"></nav>

<div class="scrim" id="scrim" role="dialog" aria-modal="true">
  <div class="modal" id="modal"></div>
</div>
<div class="toast" id="toast" role="status"></div>

<script>
/* ---------------- ícones (traço fino) ---------------- */
const sv = p => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">${p}</svg>`;
const I = {
  home:sv('<path d="M3 11l9-7 9 7"/><path d="M5 10v10h14V10"/><path d="M10 20v-6h4v6"/>'),
  plan:sv('<rect x="3" y="4" width="18" height="17"/><path d="M3 9h18M8 2v4M16 2v4M7 13h4M7 17h8"/>'),
  pack:sv('<path d="M21 8l-9-5-9 5 9 5 9-5z"/><path d="M3 8v8l9 5 9-5V8"/><path d="M12 13v8"/>'),
  team:sv('<circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c.6-3.6 3.3-5.5 6.5-5.5s5.9 1.9 6.5 5.5"/><circle cx="17.5" cy="9" r="2.5"/><path d="M16.5 14.6c2.6.2 4.4 1.8 5 4.9"/>'),
  flag:sv('<path d="M5 21V4"/><path d="M5 4h11l-2 4 2 4H5"/>'),
  gear:sv('<circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M4.9 19.1L7 17M17 7l2.1-2.1"/>'),
  more:sv('<path d="M4 6h16M4 12h16M4 18h16"/>'),
  left:sv('<path d="M15 18l-6-6 6-6"/>'),
  right:sv('<path d="M9 18l6-6-6-6"/>'),
  plus:sv('<path d="M12 5v14M5 12h14"/>'),
  copy:sv('<rect x="9" y="9" width="12" height="12"/><path d="M5 15V5a2 2 0 012-2h10"/>'),
  chat:sv('<path d="M21 12a8 8 0 01-11.6 7.1L3 21l1.9-6.4A8 8 0 1121 12z"/>'),
  user:sv('<circle cx="12" cy="8" r="4"/><path d="M4 21c1-4 4-6 8-6s7 2 8 6"/>'),
  cal:sv('<rect x="3" y="4" width="18" height="17"/><path d="M3 9h18M8 2v4M16 2v4"/>'),
  check:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5 9-10"/></svg>',
  x:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>',
};

/* ---------------- dados de exemplo ---------------- */
const MOTIVOS = ['Chuva','Falta de material','Falta de equipe','Projeto','Equipamento','Frente não liberada','Outro'];
const DIAS = [
  {k:'2026-10-05',d:'Seg',n:'05/10'},{k:'2026-10-06',d:'Ter',n:'06/10'},{k:'2026-10-07',d:'Qua',n:'07/10'},
  {k:'2026-10-08',d:'Qui',n:'08/10'},{k:'2026-10-09',d:'Sex',n:'09/10'},{k:'2026-10-10',d:'Sáb',n:'10/10'}];
const HOJE = '2026-10-07';

const pcp = [
  {id:1,dia:'2026-10-05',serv:'Galeria Rua 2 – trecho 1',local:'Rua 2, Quadra B',q:60,u:'m',eq:'Eq. Raimundo',st:'Concluída',ex:64},
  {id:2,dia:'2026-10-05',serv:'Terraplenagem Fase 02 – Quadra 13',local:'Quadra 13',q:3,u:'%',eq:'Terraplan Delta',st:'Concluída',ex:3.2},
  {id:3,dia:'2026-10-06',serv:'Esgoto Rua 5 – lado ímpar',local:'Rua 5',q:70,u:'m',eq:'Eq. Marcos',st:'Não concluída',ex:40,mot:'Falta de material'},
  {id:4,dia:'2026-10-06',serv:'Galeria Rua 2 – trecho 1',local:'Rua 2, Quadra B',q:60,u:'m',eq:'Eq. Raimundo',st:'Concluída',ex:60},
  {id:5,dia:'2026-10-07',serv:'Rede de água – Quadra F',local:'Quadra F',q:100,u:'m',eq:'Eq. Marcos',st:'Planejada'},
  {id:6,dia:'2026-10-07',serv:'Galeria Rua 2 – trecho 1',local:'Rua 2, Quadra B',q:60,u:'m',eq:'Eq. Raimundo',st:'Planejada'},
  {id:7,dia:'2026-10-07',serv:'Meio-fio e sarjeta – Rua 1',local:'Rua 1, lado par',q:1,u:'%',eq:'Eq. Francisco',st:'Planejada'},
  {id:8,dia:'2026-10-08',serv:'Esgoto Rua 5 – lado ímpar',local:'Rua 5',q:30,u:'m',eq:'Eq. Marcos',st:'Planejada'},
  {id:9,dia:'2026-10-08',serv:'Terraplenagem Fase 02 – Quadra 13',local:'Quadra 13',q:3,u:'%',eq:'Terraplan Delta',st:'Planejada'},
  {id:10,dia:'2026-10-09',serv:'Galeria Rua 2 – trecho 1',local:'Rua 2, Quadra B',q:60,u:'m',eq:'Eq. Raimundo',st:'Planejada'},
  {id:11,dia:'2026-10-09',serv:'Rede de água – Quadra F',local:'Quadra F',q:100,u:'m',eq:'Eq. Marcos',st:'Planejada'},
  {id:12,dia:'2026-10-10',serv:'Adutora de água – trecho externo',local:'Acesso PI-116',q:2,u:'%',eq:'Eq. Damião',st:'Planejada'},
];

const PACOTES = ['Galeria Rua 2 – trecho 1','Rede de água Fase 01 – Quadras E e F','Esgoto Rua 5 – lado ímpar'];
const equipe = [
  {n:'Raimundo Sousa',f:'Encarregado',t:'Direta',s:'Presente',p:'Galeria Rua 2 – trecho 1'},
  {n:'Francisco Lima',f:'Pedreiro',t:'Direta',s:'Presente',p:''},
  {n:'Damião Carvalho',f:'Pedreiro',t:'Direta',s:'Presente',p:''},
  {n:'José Carlos Alves',f:'Pedreiro',t:'Direta',s:'Atestado',p:''},
  {n:'Antônio Pereira',f:'Servente',t:'Direta',s:'Presente',p:'Galeria Rua 2 – trecho 1'},
  {n:'Luiz Ferreira',f:'Servente',t:'Direta',s:'Falta',p:''},
  {n:'Gilvan Santos',f:'Servente',t:'Direta',s:'Presente',p:'Galeria Rua 2 – trecho 1'},
  {n:'Josué Ribeiro',f:'Servente',t:'Direta',s:'Presente',p:'Rede de água Fase 01 – Quadras E e F'},
  {n:'Marcos Oliveira',f:'Encanador',t:'Direta',s:'Presente',p:'Rede de água Fase 01 – Quadras E e F'},
  {n:'Ana Beatriz Moura',f:'Apontador',t:'Indireta',s:'Presente',p:''},
  {n:'Carlos Eduardo Nunes',f:'Almoxarife',t:'Indireta',s:'Presente',p:''},
  {n:'Paulo Henrique Costa',f:'Operador de máquina',t:'Terceirizada',e:'Terraplan Delta Ltda',s:'Presente',p:''},
  {n:'Wellington Araújo',f:'Operador de máquina',t:'Terceirizada',e:'Terraplan Delta Ltda',s:'Presente',p:''},
  {n:'Edson Rocha',f:'Motorista',t:'Terceirizada',e:'Terraplan Delta Ltda',s:'Afastado',p:''},
];

/* ---------------- utilidades ---------------- */
const fmt = (v,dec) => v.toLocaleString('pt-BR',{minimumFractionDigits:dec??0,maximumFractionDigits:dec??1});
const qty = (v,u) => u==='%' ? `${fmt(v,1)}%` : `${fmt(v)} ${u}`;
const stCls = s => s==='Concluída'?'st-ok':s==='Não concluída'?'st-crit':'st-neutral';
const boxFor = s => s==='Concluída'?`<span class="box ok" aria-hidden="true">${I.check}</span>`:s==='Não concluída'?`<span class="box crit" aria-hidden="true">${I.x}</span>`:`<span class="box" aria-hidden="true"></span>`;
const $ = s => document.querySelector(s);
function toast(msg){const t=$('#toast');t.textContent=msg;t.classList.add('show');clearTimeout(t._h);t._h=setTimeout(()=>t.classList.remove('show'),2400)}
function ppcSemana(){const f=pcp.filter(a=>a.st!=='Planejada');const ok=f.filter(a=>a.st==='Concluída').length;return {ok,tot:f.length,pct:f.length?Math.round(ok/f.length*100):0}}
function efetivo(){
  const pres=equipe.filter(p=>p.s==='Presente');
  const by=t=>pres.filter(p=>p.t===t).length;
  const fun={};pres.forEach(p=>fun[p.f]=(fun[p.f]||0)+1);
  const c=s=>equipe.filter(p=>p.s===s).length;
  return {pres:pres.length,dir:by('Direta'),ind:by('Indireta'),ter:by('Terceirizada'),fun,falta:c('Falta'),atest:c('Atestado'),afast:c('Afastado')};
}

/* ---------------- navegação ---------------- */
const NAV = [
  {id:'inicio',l:'Início',i:'home'},
  {id:'planejamento',l:'Planejamento',i:'plan'},
  {id:'pacotes',l:'Pacotes',i:'pack'},
  {id:'efetivo',l:'Efetivo',i:'team'},
  {id:'ocorrencias',l:'Ocorrências',i:'flag'},
  {id:'cadastros',l:'Cadastros',i:'gear'},
];
const BOTTOM = ['inicio','planejamento','efetivo','ocorrencias','mais'];
const SHORT = {inicio:'Início',planejamento:'Planej.',efetivo:'Efetivo',ocorrencias:'Ocorr.'};
let tela='inicio', diaSel=HOJE;

function renderNav(){
  $('#sidenav').innerHTML = NAV.map(n=>`<button class="nav-btn" data-go="${n.id}" ${tela===n.id?'aria-current="page"':''}>${I[n.i]}<span>${n.l}</span></button>`).join('');
  $('#bottomnav').innerHTML = BOTTOM.map(id=>{
    if(id==='mais') return `<button class="tab" data-more ${['pacotes','cadastros'].includes(tela)?'aria-current="page"':''}>${I.more}<span>Mais</span></button>`;
    const n=NAV.find(x=>x.id===id);
    return `<button class="tab" data-go="${n.id}" aria-label="${n.l}" ${tela===n.id?'aria-current="page"':''}>${I[n.i]}<span>${SHORT[id]}</span></button>`;
  }).join('');
}
function go(id){tela=id;renderNav();render();window.scrollTo(0,0)}
document.addEventListener('click',e=>{
  const g=e.target.closest('[data-go]'); if(g){closeModal();go(g.dataset.go);return}
  if(e.target.closest('[data-more]')){openMore();return}
  const b=e.target.closest('[data-baixa]'); if(b){openBaixa(+b.dataset.baixa);return}
  const d=e.target.closest('[data-dia]'); if(d){diaSel=d.dataset.dia;render();return}
  const s=e.target.closest('[data-sit]'); if(s){const p=equipe[+s.dataset.i];p.s=s.dataset.sit;if(p.s!=='Presente')p.p='';render();return}
  const t=e.target.closest('[data-toast]'); if(t){toast(t.dataset.toast);return}
  if(e.target.id==='scrim') closeModal();
});
document.addEventListener('change',e=>{if(e.target.matches('[data-pac]'))equipe[+e.target.dataset.pac].p=e.target.value});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});

/* ---------------- telas ---------------- */
function render(){
  const v=$('#view');
  v.innerHTML = tela==='inicio'?telaInicio():tela==='planejamento'?telaSemana():tela==='efetivo'?telaEfetivo():tela==='ocorrencias'?telaVazia():telaFora();
}

function curvaS(){
  const W=560,H=150,pad=4;
  const prev=[0,2,5,9,14,20,27,34,41,48,55,62,68,74,79,84,88,92,95,97,99,100];
  const real=[0,1,4,7,11,16,22,28,34,38,41.8];
  const x=i=>pad+i*(W-2*pad)/(prev.length-1), y=v=>H-pad-v*(H-2*pad)/100;
  const path=a=>a.map((v,i)=>`${i?'L':'M'}${x(i).toFixed(1)},${y(v).toFixed(1)}`).join(' ');
  const hx=x(real.length-1);
  const grid=[25,50,75].map(v=>`<line x1="${pad}" x2="${W-pad}" y1="${y(v)}" y2="${y(v)}" stroke="#E1E8EF"/>`).join('');
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" height="150" role="img" aria-label="Curva S: previsto 45,2% e realizado 41,8% hoje" style="display:block;margin-top:14px;border:1px solid var(--line);background:#fff">
    ${grid}
    <line x1="${hx}" x2="${hx}" y1="${pad}" y2="${H-pad}" stroke="#132B40" stroke-width="1" stroke-dasharray="3 4"/>
    <path d="${path(prev)}" fill="none" stroke="#8FA4B9" stroke-width="2" stroke-dasharray="6 4"/>
    <path d="${path(real)}" fill="none" stroke="#1F4E79" stroke-width="3"/>
    <rect x="${hx-5}" y="${y(41.8)-5}" width="10" height="10" fill="#1F4E79"/>
  </svg>
  <div class="legend lab"><span><i style="background:#1F4E79"></i>Realizado</span><span><i style="background:repeating-linear-gradient(90deg,#8FA4B9 0 6px,transparent 6px 10px)"></i>Previsto</span><span><i style="background:#132B40;height:1px"></i>Hoje</span></div>`;
}

function telaInicio(){
  const ef=efetivo(), pp=ppcSemana();
  const hoje=pcp.filter(a=>a.dia===HOJE);
  const etapas=[['Geral',78.5,80.1],['Fase 01',52.3,58.0],['Fase 02',6.9,7.5]];
  const funs=Object.entries(ef.fun).sort((a,b)=>b[1]-a[1]);
  return `
  <div class="page-head"><div><div class="lab">Painel do dia · Quarta, 07/10/2026</div><h1>Bom dia, Otoniel</h1></div></div>

  <div class="kpis">
    <div class="kpi"><b class="num">41,8<small>%</small></b><span class="lab">Avanço realizado</span></div>
    <div class="kpi"><b class="num">${ef.pres}</b><span class="lab">Pessoas no canteiro</span></div>
    <div class="kpi warn"><b class="num">${pp.pct}<small>%</small></b><span class="lab">PPC da semana</span></div>
    <div class="kpi crit"><b class="num">2</b><span class="lab">Alertas críticos</span></div>
  </div>

  <div class="grid">
    <section class="section span-7" aria-labelledby="h-av">
      <div class="sec-head"><span class="lab" id="h-av">Avanço físico</span><button class="link" data-go="planejamento">Cronograma</button></div>
      <div class="av-top">
        <div><div class="lab">Realizado</div><div class="av-num num">41,8<small>%</small></div></div>
        <div><div class="lab">Previsto hoje</div><div class="av-prev num">45,2%</div></div>
        <span class="st st-crit">−3,4 p.p. abaixo</span>
      </div>
      <div class="etapas">
        ${etapas.map(([n,r,p])=>`
        <div class="etapa-row">
          <b>${n}</b>
          <div class="bar" aria-hidden="true"><i style="width:${r}%"></i><span class="mark" style="left:${p}%"></span></div>
          <div class="etapa-val num"><b>${fmt(r,1)}%</b> / ${fmt(p,1)}%</div>
        </div>`).join('')}
      </div>
      ${curvaS()}
      <button class="notice" data-toast="Abriria o Cronograma em “Editar custos”">2 serviços sem custo — avanço ponderado por duração<span class="go">Editar custos</span></button>
    </section>

    <section class="section span-5" aria-labelledby="h-al">
      <div class="sec-head"><span class="lab" id="h-al">Alertas · 4</span><button class="link" data-go="planejamento">Ver todos</button></div>
      <div class="list">
        <button class="row" data-go="planejamento"><span class="mark-sq" style="background:var(--red)"></span><div class="row-main"><div class="row-title">Meio-fio e sarjeta – Fase 01</div><div class="row-meta crit">Não iniciou · atrasado 9 dias</div></div></button>
        <button class="row" data-go="planejamento"><span class="mark-sq" style="background:var(--red)"></span><div class="row-main"><div class="row-title">Rede de esgoto – Fase 01</div><div class="row-meta crit">Caminho crítico · folga zero</div></div></button>
        <button class="row" data-toast="Abriria a restrição no plano de 3 meses"><span class="mark-sq" style="background:var(--amber)"></span><div class="row-main"><div class="row-title">Liberação da Rua 5 pela topografia</div><div class="row-meta warn">Restrição vencida · prazo 02/10</div></div></button>
        <button class="row" data-go="ocorrencias"><span class="mark-sq" style="background:var(--amber)"></span><div class="row-main"><div class="row-title">Ocorrência nº 1 — Poça d'água na Rua 2</div><div class="row-meta warn">Sem resposta há 6 dias</div></div></button>
      </div>
    </section>

    <section class="section span-7" aria-labelledby="h-at">
      <div class="sec-head"><span class="lab" id="h-at">Atividades de hoje · ${hoje.length}</span><button class="link" data-go="planejamento">Ver semana</button></div>
      <div class="list">
        ${hoje.map(a=>`
        <div class="row">
          ${boxFor(a.st)}
          <div class="row-main"><div class="row-title">${a.serv}</div><div class="row-meta">${a.local} · ${a.eq}</div></div>
          <div class="row-qty num">${a.u==='%'?fmt(a.q,1)+'<small>%</small>':fmt(a.q)+' <small>'+a.u+'</small>'}</div>
        </div>`).join('')}
      </div>
      <div class="foot-box"><div><div class="lab">PPC da semana até agora</div><div class="v num">${pp.pct}% <span class="lab">· ${pp.ok} de ${pp.tot}</span></div></div><button class="btn" data-go="planejamento">Abrir</button></div>
    </section>

    <section class="section span-5" aria-labelledby="h-ef">
      <div class="sec-head"><span class="lab" id="h-ef">Efetivo de hoje</span><button class="link" data-go="efetivo">Editar</button></div>
      <div class="av-top"><div><div class="av-num num">${ef.pres}</div><div class="lab" style="margin-top:6px">Presentes</div></div>
        <div class="lab" style="line-height:1.7">${ef.falta} falta<br>${ef.atest} atestado<br>${ef.afast} afastado</div></div>
      <div class="tri">
        <div><b class="num">${ef.dir}</b><span class="lab">Direta</span></div>
        <div><b class="num">${ef.ind}</b><span class="lab">Indireta</span></div>
        <div><b class="num">${ef.ter}</b><span class="lab">Terceirizada</span></div>
      </div>
      <div class="fun-list">${funs.map(([f,n])=>`<div class="fun"><span>${f}</span><b class="num">${n}</b></div>`).join('')}</div>
    </section>
  </div>`;
}

function telaSemana(){
  const pp=ppcSemana();
  const hist={'Chuva':4,'Falta de material':2,'Frente não liberada':3,'Falta de equipe':1,'Projeto':1};
  pcp.filter(a=>a.mot).forEach(a=>hist[a.mot]=(hist[a.mot]||0)+1);
  const maxH=Math.max(...Object.values(hist));
  return `
  <div class="page-head">
    <div><div class="lab">Planejamento · Semana (PCP)</div><h1>Planejamento da semana</h1></div>
    <div class="actions">
      <button class="btn btn-quiet" data-toast="Copiaria o saldo das não concluídas para 12/10 a 17/10">${I.copy}Copiar pendentes</button>
      <button class="btn btn-fill" data-toast="Abriria o formulário de nova atividade">${I.plus}Nova atividade</button>
    </div>
  </div>
  <div class="weekbar">
    <div class="weekpick"><button aria-label="Semana anterior" data-toast="Semana 28/09 a 03/10 · PPC 67%">${I.left}</button><b>05/10 – 10/10/2026</b><button aria-label="Próxima semana" data-toast="Semana 12/10 a 17/10 ainda não montada">${I.right}</button></div>
    <div class="ppc-box"><b class="num">${pp.pct}%</b><span class="lab">PPC<br>${pp.ok} de ${pp.tot}</span></div>
  </div>
  <div class="daytabs" role="group" aria-label="Dia da semana">
    ${DIAS.map(d=>`<button data-dia="${d.k}" aria-pressed="${diaSel===d.k}">${d.d}<small>${d.n}</small></button>`).join('')}
  </div>
  <div class="week">
    ${DIAS.map(d=>{
      const its=pcp.filter(a=>a.dia===d.k);
      return `<div class="daycol ${d.k===HOJE?'is-today':''} ${diaSel===d.k?'show':''}">
        <h3><span>${d.d} · ${d.n}</span></h3>
        ${its.length?its.map(a=>`
        <article class="task">
          <div class="task-top">${boxFor(a.st)}<div><div class="task-title">${a.serv}</div><div class="task-meta">${a.local} · ${a.eq}</div></div></div>
          <div class="task-qty"><b class="num">${a.st==='Planejada'?qty(a.q,a.u):qty(a.ex,a.u)}</b><span>${a.st==='Planejada'?'planejado':'de '+qty(a.q,a.u)}</span></div>
          <div class="task-foot">
            <span class="st ${stCls(a.st)}">${a.st}${a.mot?' · '+a.mot:''}</span>
            ${a.st==='Planejada'?`<button class="btn btn-fill" data-baixa="${a.id}">Dar baixa</button>`:`<button class="btn btn-quiet" data-baixa="${a.id}">Corrigir baixa</button>`}
          </div>
        </article>`).join(''):`<p class="empty-day">Sem atividades.</p>`}
      </div>`}).join('')}
  </div>
  <section class="section chart" aria-labelledby="h-mot">
    <div class="sec-head"><span class="lab" id="h-mot">Por que não concluímos · últimas 8 semanas</span></div>
    ${Object.entries(hist).sort((a,b)=>b[1]-a[1]).map(([k,v])=>`
    <div class="mot"><span>${k}</span><div class="bar"><i style="width:${v/maxH*100}%"></i></div><b class="num">${v}</b></div>`).join('')}
  </section>`;
}

function telaEfetivo(){
  const ef=efetivo();
  const grupo=t=>{
    const ps=equipe.map((p,i)=>({...p,i})).filter(p=>p.t===t);
    const nome=t==='Direta'?'Mão de obra direta':t==='Indireta'?'Mão de obra indireta':'Terceirizada';
    return `<section class="group"><div class="sec-head"><span class="lab">${nome}</span><span class="count" style="margin-left:auto">${ps.filter(p=>p.s==='Presente').length} / ${ps.length} presentes</span></div>
    ${ps.map(p=>`
      <div class="person">
        <div><div class="person-name">${p.n}</div><div class="person-role">${p.f}${p.e?' · '+p.e:''}</div></div>
        <div class="seg" role="group" aria-label="Situação de ${p.n}">
          ${['Presente','Falta','Atestado','Afastado'].map(s=>`<button class="v-${s}" data-sit="${s}" data-i="${p.i}" aria-pressed="${p.s===s}">${s}</button>`).join('')}
        </div>
        <div class="pac">
          <select data-pac="${p.i}" aria-label="Pacote de ${p.n}" ${p.s!=='Presente'||t==='Terceirizada'?'disabled':''}>
            <option value="">${t==='Terceirizada'?'Terceirizado — sem pacote':'Sem pacote'}</option>
            ${PACOTES.map(k=>`<option ${p.p===k?'selected':''}>${k}</option>`).join('')}
          </select>
        </div>
      </div>`).join('')}</section>`;
  };
  return `
  <div class="page-head"><div><div class="lab">Efetivo · quem trabalhou em pacote conta para o prêmio</div><h1>Efetivo do dia</h1></div></div>
  <div class="toolbar">
    <div class="datebox">${I.cal}Qua · 07/10/2026</div>
    <button class="btn btn-quiet" data-toast="Situações e pacotes de ontem copiados">${I.copy}Repetir ontem</button>
  </div>
  <div class="kpis">
    <div class="kpi"><b class="num" style="color:var(--ok-ink)">${ef.pres}</b><span class="lab">Presentes</span></div>
    <div class="kpi crit"><b class="num">${ef.falta}</b><span class="lab">Faltas</span></div>
    <div class="kpi warn"><b class="num">${ef.atest}</b><span class="lab">Atestados</span></div>
    <div class="kpi"><b class="num">${ef.afast}</b><span class="lab">Afastados</span></div>
  </div>
  ${grupo('Direta')}${grupo('Indireta')}${grupo('Terceirizada')}
  <div class="savebar"><span class="num"><span class="save-long">${ef.pres} presentes · Direta ${ef.dir} · Indireta ${ef.ind} · Terceirizada ${ef.ter}</span><span class="save-short">${ef.pres} presentes</span></span>
    <button class="btn btn-fill btn-lg" data-toast="Efetivo de 07/10 salvo: ${ef.pres} presentes">Salvar efetivo</button></div>`;
}

function telaVazia(){
  return `
  <div class="page-head"><div><div class="lab">Ocorrências do cliente · Conviver Urbanismo</div><h1>Ocorrências</h1></div></div>
  <div class="empty">
    <div class="empty-icon">${I.chat}</div>
    <div class="lab">0 registros</div>
    <h2>Nenhuma ocorrência por aqui</h2>
    <p>Quando a Conviver Urbanismo registrar algo — com foto, local e descrição — aparece nesta lista com o prazo de resposta. Você também pode registrar uma em nome dela.</p>
    <button class="btn btn-fill btn-lg" data-toast="Abriria o formulário de nova ocorrência">${I.plus}Registrar a primeira ocorrência</button>
  </div>`;
}

function telaFora(){
  const n=NAV.find(x=>x.id===tela);
  return `<div class="page-head"><div><div class="lab">Fora deste preview</div><h1>${n.l}</h1></div></div>
  <div class="section"><p>O preview mostra <b>Início</b>, <b>Planejamento</b>, <b>Efetivo</b> e o estado vazio de <b>Ocorrências</b>. ${n.l} segue o mesmo estilo quando o visual for aprovado.</p>
  <div style="margin-top:18px"><button class="btn" data-go="inicio">Voltar ao início</button></div></div>`;
}

/* ---------------- baixa (janela) ---------------- */
let motivoSel=null;
function openBaixa(id){
  const a=pcp.find(x=>x.id===id); motivoSel=a.mot||null;
  $('#modal').innerHTML=`
    <div class="lab">Dar baixa · ${DIAS.find(d=>d.k===a.dia).d} ${DIAS.find(d=>d.k===a.dia).n}</div>
    <h2>${a.serv}</h2>
    <div class="sub">${a.local} · ${a.eq} · planejado <b>${qty(a.q,a.u)}</b></div>
    <div class="field">
      <label class="lab" for="exec">Quanto foi executado?</label>
      <div class="qty-input"><input id="exec" type="number" inputmode="decimal" step="any" min="0" value="${a.ex??a.q}"><span>${a.u}</span></div>
      <div class="qty-hint" id="hint"></div>
    </div>
    <div class="field" id="motbox">
      <span class="lab">Motivo de não concluir</span>
      <div class="reasons" style="margin-top:8px">${MOTIVOS.map(m=>`<button type="button" data-m="${m}" aria-pressed="${motivoSel===m}">${m}</button>`).join('')}</div>
    </div>
    <div class="modal-actions">
      <button class="btn btn-quiet btn-lg" id="cancel">Cancelar</button>
      <button class="btn btn-fill btn-lg" id="save">Salvar baixa</button>
    </div>`;
  $('#scrim').classList.add('open');
  const upd=()=>{
    const v=parseFloat($('#exec').value)||0, ok=v>=a.q;
    $('#motbox').style.display=ok?'none':'block';
    $('#hint').innerHTML=ok?`<span class="st st-ok">Fica concluída</span>`:`<span class="st st-crit">Fica não concluída — escolha o motivo</span>`;
  };
  $('#exec').addEventListener('input',upd); upd();
  $('#modal').querySelectorAll('[data-m]').forEach(b=>b.onclick=()=>{motivoSel=b.dataset.m;$('#modal').querySelectorAll('[data-m]').forEach(x=>x.setAttribute('aria-pressed',x===b))});
  $('#cancel').onclick=closeModal;
  $('#save').onclick=()=>{
    const v=parseFloat($('#exec').value)||0;
    if(v<a.q && !motivoSel){toast('Escolha o motivo para salvar');return}
    a.ex=v; a.st=v>=a.q?'Concluída':'Não concluída'; a.mot=a.st==='Concluída'?null:motivoSel;
    closeModal(); render(); toast(`Baixa salva · ${a.st}`);
  };
  setTimeout(()=>$('#exec').focus(),50);
}
function openMore(){
  $('#modal').innerHTML=`<div class="lab" style="margin-bottom:8px">Mais opções</div>
    <button class="sheet-item" data-go="pacotes">${I.pack}Pacotes</button>
    <button class="sheet-item" data-go="cadastros">${I.gear}Cadastros</button>
    <button class="sheet-item" data-toast="Meu perfil: nome, trocar senha, sair">${I.user}Meu perfil</button>
    <div class="modal-actions" style="margin-top:14px"><button class="btn btn-quiet btn-lg" id="cancel">Fechar</button></div>`;
  $('#scrim').classList.add('open'); $('#cancel').onclick=closeModal;
}
function closeModal(){$('#scrim').classList.remove('open')}

renderNav(); render();
</script>
